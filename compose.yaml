services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      retries: 15

  api:
    image: python:3.12-slim
    working_dir: /code
    volumes:
      - ./app.py:/code/app.py:ro
      - ./db.py:/code/db.py:ro
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn 'psycopg[binary]' &&
      uvicorn app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
